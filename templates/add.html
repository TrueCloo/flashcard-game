<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Flashcard</title>
  </head>
  <body>
    <a href="/">Home</a>
    <form action="/add" method="POST">
      <label for="question">Question</label>
      <input id="question" type="text" name="question" autocomplete="off" autofocus required>
      <label for="answer">Answer</label>
      <input id="answer" type="text" name="answer" autocomplete="off" required>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
