<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards</title>
  </head>
  <body>
    <h3>Lives: {{ lives }}</h3>
    <p>{{ card.question }}</p>

      <button type="submit">Answer</button>
    </form>
  </body>
</html>
