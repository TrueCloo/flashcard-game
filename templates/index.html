<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards</title>
  </head>
  <body>
    {% for card in cards %}
      <details>
        <summary>{{ card.question }}</summary>
        <p>{{ card.answer }}</p>
      </details>
    {% endfor %}
  </body>
</html>
